[package]
name = "cryptomeria"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
questdb-rs = { version = "6", features = ["chrono_timestamp"] }
chrono = "0.4"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
urlencoding = "2.1.3"
ordered-float = "4"
clap = { version = "4", features = ["derive"] }
prometheus = { version = "0.13", features = ["process"] }
actix-web = "4"
rand = "0.8"
prettytable-rs = "0.10"
log = "0.4"
rasant = "1.1"

[dev-dependencies]
serde_test = "1"
serial_test = "2.0"
testcontainers = "0.27"

[[test]]
name = "okx_integration"
path = "tests/okx_integration.rs"
harness = true

[[test]]
name = "kraken_integration"
path = "tests/kraken_integration.rs"
harness = true

[[test]]
name = "bitstamp_integration"
path = "tests/bitstamp_integration.rs"
harness = true

[[test]]
name = "questdb_migration"
path = "tests/questdb_migration.rs"
harness = true

