name: Python Tests and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  py-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv sync --dev
      - run: uv run ruff check python/
      - run: uv run pytest python/ -v
